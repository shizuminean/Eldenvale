name: Build APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'quests/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip "cython<3" "buildozer==1.5.0"
      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Ringkasan error
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          echo "=== baris yang mengandung error ==="
          grep -n -i -E "error:|fatal|No such file|Traceback|undefined reference" clean.log | grep -v -E "^[0-9]+:# " | tail -25 | cut -c1-200
          echo "=== 30 baris sebelum Command failed ==="
          N=$(grep -n "Command failed" clean.log | head -1 | cut -d: -f1)
          if [ -n "$N" ]; then S=$((N-30)); [ $S -lt 1 ] && S=1; sed -n "${S},${N}p" clean.log | cut -c1-200; fi
      - name: Simpan log lengkap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            clean.log
          if-no-files-found: ignore
      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: eldenvale-apk
          path: bin/*.apk
